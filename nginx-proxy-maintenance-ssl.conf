# Configuración de mantenimiento con SSL
# Mantiene certificados SSL pero redirige todo a página de mantenimiento

# Rate limiting durante mantenimiento
limit_req_zone $binary_remote_addr zone=maintenance:10m rate=5r/s;

# Upstream para frontend (página de mantenimiento)
upstream frontend_maintenance {
    server frontend:80;
}

# Servidor HTTP - Redirección a HTTPS mantenida
server {
    listen 80;
    server_name vps-4778464-x.dattaweb.com;

    # Let's Encrypt validation (mantener para renovaciones)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirección a HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Servidor HTTPS principal - MODO MANTENIMIENTO
server {
    listen 443 ssl;
    http2 on;
    server_name vps-4778464-x.dattaweb.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/vps-4778464-x.dattaweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps-4778464-x.dattaweb.com/privkey.pem;
    
    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting durante mantenimiento
    limit_req zone=maintenance burst=10 nodelay;
    
    # Configuración general
    client_max_body_size 5M;
    
    # API - solo para administradores desde IPs específicas
    location /api/ {
        # Permitir solo IPs administrativas
        allow 127.0.0.1;
        allow 172.20.0.0/16;  # Red Docker interna
        allow 149.50.132.23;  # IP del servidor
        deny all;
        
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers para API administrativa
        add_header 'Access-Control-Allow-Origin' 'https://vps-4778464-x.dattaweb.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
    }
    
    # Health check siempre disponible
    location /health {
        proxy_pass http://frontend_maintenance/health;
        access_log off;
    }
    
    # PÁGINA DE MANTENIMIENTO para todas las demás rutas
    location / {
        proxy_pass http://frontend_maintenance;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers para evitar caché de la página de mantenimiento
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # Logs específicos para mantenimiento
    access_log /var/log/nginx/maintenance-access.log;
    error_log /var/log/nginx/maintenance-error.log;
}
