server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    location / {
        root /usr/share/nginx/html;
        try_files /maintenance.html =503;
    }
    
    location /health {
        access_log off;
        return 200 "maintenance mode";
        add_header Content-Type text/plain;
    }
}
