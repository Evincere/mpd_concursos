# Configuración temporal para modo mantenimiento
# Permite acceso HTTP directo a la página de mantenimiento

# Rate limiting básico durante mantenimiento
limit_req_zone $binary_remote_addr zone=maintenance:10m rate=5r/s;

# Upstream para frontend (página de mantenimiento)
upstream frontend_maintenance {
    server frontend:80;
}

# Servidor HTTP principal (sin redirección durante mantenimiento)
server {
    listen 80 default_server;
    server_name _;
    
    # Rate limiting durante mantenimiento
    limit_req zone=maintenance burst=10 nodelay;
    
    # Headers de seguridad básicos
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Configuración general
    client_max_body_size 5M;
    
    # API - solo para administradores (puedes cambiar las IPs según necesidad)
    location /api/ {
        # Permitir solo IPs administrativas - CAMBIAR SEGÚN NECESIDAD
        allow 127.0.0.1;
        allow 172.20.0.0/16;  # Red Docker interna
        allow 149.50.132.23;  # IP del servidor
        deny all;
        
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers para API administrativa
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
    }
    
    # Health check siempre disponible
    location /health {
        proxy_pass http://frontend_maintenance/health;
        access_log off;
    }
    
    # Página de mantenimiento para todas las demás rutas
    location / {
        proxy_pass http://frontend_maintenance;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers para evitar caché de la página de mantenimiento
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # Logs específicos para mantenimiento
    access_log /var/log/nginx/maintenance-access.log;
    error_log /var/log/nginx/maintenance-error.log;
}

# Servidor HTTPS - mantener certificados pero redirigir a mantenimiento
server {
    listen 443 ssl http2;
    server_name vps-4778464-x.dattaweb.com;

    # SSL Configuration (mantener certificados válidos)
    ssl_certificate /etc/letsencrypt/live/vps-4778464-x.dattaweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps-4778464-x.dattaweb.com/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Todas las rutas HTTPS van a página de mantenimiento
    location / {
        proxy_pass http://frontend_maintenance;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
