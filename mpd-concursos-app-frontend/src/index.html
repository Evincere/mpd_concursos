<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Defensa Mendoza</title>
  <script>
    // Configurar base href según el entorno
    if (window.process && window.process.type === 'renderer') {
      document.write('<base href="app://">');
    } else {
      document.write('<base href="./">');
    }
  </script>
  <!-- La política de seguridad se aplicará dinámicamente desde el código JavaScript según el entorno -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body class="mat-typography dark-mode">
  <app-root></app-root>
</body>
</html>
