<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Defensa Mendoza - Sistema de Concursos</title>
  <meta name="description" content="Sistema de gestión de concursos del Ministerio Público de la Defensa de Mendoza">
  <meta name="theme-color" content="#374151">
  <base href="/">
  <script>
    // Configurar base href según el entorno (solo para Electron)
    if (window.process && window.process.type === 'renderer') {
      document.querySelector('base').href = 'app://';
    }
  </script>
  <!-- La política de seguridad se aplicará dinámicamente desde el código JavaScript según el entorno -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/favicon.png">

  <!-- Fonts - Usando fuentes locales para mejor rendimiento y confiabilidad -->
  <!-- Las fuentes se cargan desde node_modules a través de styles.scss -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1976d2">
</head>
<body class="mat-typography dark-mode">
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
