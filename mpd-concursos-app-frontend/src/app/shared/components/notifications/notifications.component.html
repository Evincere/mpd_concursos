<div class="notifications-container">
    <!-- Botón de notificaciones glassmorphism custom -->
    <button class="notification-toggle btn-glassmorphism"
            (click)="toggleNotifications()"
            [attr.aria-label]="'Notificaciones' + (unreadCount > 0 ? ' (' + unreadCount + ' sin leer)' : '')"
            type="button">
        <i class="fas fa-bell" aria-hidden="true"></i>
        <span class="notification-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
    </button>

    <!-- Panel de notificaciones glassmorphism -->
    <div class="notifications-panel glassmorphism" *ngIf="showNotifications">
        <div class="notifications-header">
            <h3>Notificaciones</h3>
            <button class="close-button btn-glassmorphism"
                    (click)="toggleNotifications()"
                    aria-label="Cerrar panel de notificaciones"
                    type="button">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
        </div>

        <div class="notifications-list">
            <app-notification-item
                *ngFor="let notification of notifications; trackBy: trackByNotificationId"
                [notification]="notification"
                (read)="onNotificationRead($event)"
                (acknowledge)="onNotificationAcknowledge($event)">
            </app-notification-item>

            <div class="no-notifications" *ngIf="notifications.length === 0">
                <i class="fas fa-bell-slash" aria-hidden="true"></i>
                <p>No hay notificaciones</p>
            </div>
        </div>
    </div>
</div>
