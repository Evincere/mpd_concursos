<header class="search-header">
    <div class="header-title">
        <i class="fas fa-{{icon}}" aria-hidden="true"></i>
        <h2>{{title}}</h2>
    </div>
    <div class="header-actions">
        <form [formGroup]="searchForm" class="search-form">
            <app-custom-form-field
                [placeholder]="placeholder"
                [showClearButton]="true"
                [iconRight]="searchForm.get('termino')?.value ? '' : 'search'"
                [control]="getTerminoControl()"
                class="search-input">
            </app-custom-form-field>
        </form>
        <app-custom-button
            [variant]="'flat'"
            [color]="filtrosActivos ? 'primary' : 'accent'"
            [icon]="filtrosActivos ? 'filter-circle-xmark' : 'filter'"
            [label]="filtrosActivos ? 'Filtros Activos' : 'Filtros'"
            [tooltip]="'Abrir panel de filtros'"
            [class.active]="filtrosActivos"
            (buttonClick)="filterClick.emit()"
            class="filter-button">
        </app-custom-button>
    </div>
</header>
