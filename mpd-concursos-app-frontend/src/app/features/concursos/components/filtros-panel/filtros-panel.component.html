<div class="filtros-panel">
  <!-- Panel Header -->
  <header class="panel-header">
    <div class="header-title">
      <i class="fas fa-filter" aria-hidden="true"></i>
      <h2>Filtros de Búsqueda</h2>
    </div>
    <app-custom-button
      [variant]="'icon'"
      [icon]="'times'"
      [tooltip]="'Cerrar panel'"
      (buttonClick)="cerrarPanel()"
      class="close-button">
    </app-custom-button>
  </header>

  <!-- Panel Content -->
  <div class="panel-content">
    <form [formGroup]="filtrosForm" class="filtros-form">

      <!-- Estado Filter Group -->
      <div class="filter-group">
        <div class="filter-header">
          <i class="fas fa-circle-check filter-icon" aria-hidden="true"></i>
          <h3 class="filter-title">Estado del Concurso</h3>
        </div>
        <div class="filter-options">
          <div class="button-grid">
            <app-custom-button
              *ngFor="let option of estadoOptions"
              [variant]="'stroked'"
              [color]="filtrosForm.get('estado')?.value === option.value ? 'primary' : 'accent'"
              [icon]="option.icon"
              [label]="option.label"
              [class.active]="filtrosForm.get('estado')?.value === option.value"
              (buttonClick)="onToggleChange('estado', option.value)"
              class="filter-button">
            </app-custom-button>
          </div>
        </div>
      </div>

      <!-- Periodo Filter Group -->
      <div class="filter-group">
        <div class="filter-header">
          <i class="fas fa-calendar-alt filter-icon" aria-hidden="true"></i>
          <h3 class="filter-title">Período de Publicación</h3>
        </div>
        <div class="filter-options">
          <div class="button-grid">
            <app-custom-button
              *ngFor="let option of periodoOptions"
              [variant]="'stroked'"
              [color]="filtrosForm.get('periodo')?.value === option.value ? 'primary' : 'accent'"
              [icon]="option.icon"
              [label]="option.label"
              [class.active]="filtrosForm.get('periodo')?.value === option.value"
              (buttonClick)="onToggleChange('periodo', option.value)"
              class="filter-button">
            </app-custom-button>
          </div>
        </div>
      </div>

      <!-- Dependencia Filter Group -->
      <div class="filter-group">
        <div class="filter-header">
          <i class="fas fa-building filter-icon" aria-hidden="true"></i>
          <h3 class="filter-title">Dependencia</h3>
        </div>
        <div class="filter-options">
          <app-custom-select
            [placeholder]="'Seleccione dependencia'"
            [options]="dependenciaOptions"
            [control]="getDependenciaControl()"
            class="filter-select">
          </app-custom-select>
        </div>
      </div>

      <!-- Cargo Filter Group -->
      <div class="filter-group">
        <div class="filter-header">
          <i class="fas fa-briefcase filter-icon" aria-hidden="true"></i>
          <h3 class="filter-title">Tipo de Cargo</h3>
        </div>
        <div class="filter-options">
          <app-custom-select
            [placeholder]="'Seleccione tipo de cargo'"
            [options]="cargoOptions"
            [control]="getCargoControl()"
            class="filter-select">
          </app-custom-select>
        </div>
      </div>

    </form>
  </div>

  <!-- Panel Footer -->
  <footer class="panel-footer">
    <div class="footer-actions">
      <app-custom-button
        [variant]="'stroked'"
        [color]="'accent'"
        [icon]="'undo'"
        [label]="'Limpiar Filtros'"
        (buttonClick)="limpiarFiltros()"
        class="clear-button">
      </app-custom-button>
      <app-custom-button
        [variant]="'primary'"
        [color]="'primary'"
        [icon]="'check'"
        [label]="'Aplicar'"
        (buttonClick)="aplicarFiltros()"
        class="apply-button">
      </app-custom-button>
    </div>
  </footer>
</div>
