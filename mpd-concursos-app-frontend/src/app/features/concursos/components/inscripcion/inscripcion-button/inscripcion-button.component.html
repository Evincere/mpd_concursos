<ng-container *ngIf="inscripcionState$ | async as estado">
    <app-custom-button
        [variant]="getButtonVariant(estado)"
        [label]="getButtonLabel(estado)"
        [icon]="getButtonIcon(estado)"
        [loading]="loading"
        [disabled]="loading || estado === InscripcionState.APPROVED || estado === InscripcionState.INSCRIPTO"
        [ariaLabel]="getAriaLabel(estado)"
        [tooltip]="getButtonTooltip(estado)"
        (buttonClick)="onInscribirse()"
        class="inscripcion-button"
        [class.inscripto]="estado === InscripcionState.APPROVED || estado === InscripcionState.INSCRIPTO"
        [class.pending]="estado === InscripcionState.PENDING || estado === InscripcionState.PENDIENTE"
        [class.rejected]="estado === InscripcionState.REJECTED"
        [class.cancelled]="estado === InscripcionState.CANCELLED">
    </app-custom-button>
</ng-container>
