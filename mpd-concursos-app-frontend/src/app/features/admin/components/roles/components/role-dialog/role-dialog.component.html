<!-- Glassmorphism Role Dialog - Usando componentes custom y CSS variables -->
<div class="role-dialog-container">
  <div class="dialog-header">
    <h2 class="dialog-title">{{data.title}}</h2>
  </div>

  <div class="dialog-content">
    <app-custom-tabs [(selectedIndex)]="activeTab" (selectedIndexChange)="onTabChange($event)">
      <!-- Pestaña de Información Básica -->
      <app-custom-tab label="Información Básica">
        <div class="tab-content">
          <form [formGroup]="roleForm" class="role-form">
            <app-custom-form-field
              [label]="'Nombre del Rol'"
              [placeholder]="'Ej: ROLE_MANAGER'"
              [control]="$any(roleForm.get('name'))"
              [required]="true"
              [hint]="'El nombre debe comenzar con ROLE_ y solo puede contener letras, números y guiones bajos'"
              [errorMessage]="getFieldError('name')">
            </app-custom-form-field>

            <app-custom-textarea
              [label]="'Descripción'"
              [placeholder]="'Descripción del rol'"
              [control]="$any(roleForm.get('description'))"
              [required]="true"
              [rows]="3"
              [errorMessage]="getFieldError('description')">
            </app-custom-textarea>
          </form>

          <div *ngIf="isSystemRole()" class="system-role-notice">
            <i class="fas fa-info-circle"></i>
            <span>Este es un rol del sistema y algunos campos no pueden ser modificados.</span>
          </div>
        </div>
      </app-custom-tab>

      <!-- Pestaña de Permisos -->
      <app-custom-tab label="Permisos">
        <div class="tab-content">
          <app-permissions-matrix
            [roleId]="data.role?.id || ''"
            [roleName]="data.role?.name || roleForm.get('name')?.value || 'Nuevo Rol'"
            [selectedPermissions]="selectedPermissions"
            [isSystemRole]="isSystemRole()"
            (permissionsChange)="onPermissionsChange($event)">
          </app-permissions-matrix>
        </div>
      </app-custom-tab>
    </app-custom-tabs>
  </div>

  <div class="dialog-actions">
    <app-custom-button
      [label]="'Cancelar'"
      [variant]="'stroked'"
      (buttonClick)="cancel()">
    </app-custom-button>

    <app-custom-button
      [label]="isEditMode ? 'Actualizar' : 'Crear'"
      [variant]="'raised'"
      [color]="'primary'"
      [disabled]="roleForm.invalid || isSystemRole()"
      (buttonClick)="save()">
    </app-custom-button>
  </div>
</div>
