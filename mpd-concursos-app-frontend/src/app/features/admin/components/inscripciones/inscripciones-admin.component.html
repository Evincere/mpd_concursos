<div class="inscripciones-admin-container">
  <!-- Premium Glassmorphism Header -->
  <div class="header">
    <div class="header-content">
      <h1 class="page-title">
        <i class="fas fa-clipboard-list" aria-hidden="true"></i>
        {{ pageTitle }}
      </h1>
      <p class="page-subtitle">{{ pageSubtitle }}</p>
    </div>
    <div class="header-actions">
      <app-custom-button
        [variant]="'stroked'"
        [color]="'primary'"
        [icon]="'dashboard'"
        [routerLink]="['/admin/inscripciones/dashboard']">
        Dashboard
      </app-custom-button>
    </div>
  </div>

  <!-- Tabla de inscripciones personalizada -->
  <app-custom-inscriptions-table
    [inscriptions]="dataSource"
    [isLoading]="isLoading"
    [totalItems]="totalItems"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [contests]="contests"
    (viewInscription)="viewInscripcion($event)"
    (approveInscription)="updateStatus($event, 'APPROVED')"
    (rejectInscription)="updateStatus($event, 'REJECTED')"
    (actionExecuted)="handleActionExecuted($event)"
    (filterChange)="loadInscripciones()"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)">
  </app-custom-inscriptions-table>
</div>

<!-- Componente de detalle de inscripción (se mostrará como diálogo) -->
<!-- Este componente se cargará dinámicamente cuando se llame a viewInscripcion() -->
