<h2 mat-dialog-title>{{isEditMode ? 'Editar' : 'Crear'}} Plantilla</h2>

<mat-dialog-content>
  <form [formGroup]="templateForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre de la Plantilla</mat-label>
      <input matInput formControlName="name" placeholder="Ingrese un nombre descriptivo">
      <mat-error *ngIf="templateForm.get('name')?.hasError('required')">
        El nombre es requerido
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Asunto</mat-label>
      <input matInput formControlName="subject" placeholder="Ingrese el asunto de la comunicación">
      <mat-error *ngIf="templateForm.get('subject')?.hasError('required')">
        El asunto es requerido
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Contenido</mat-label>
      <textarea matInput formControlName="content" rows="10" 
                placeholder="Ingrese el contenido de la comunicación"></textarea>
      <mat-error *ngIf="templateForm.get('content')?.hasError('required')">
        El contenido es requerido
      </mat-error>
    </mat-form-field>

    <div class="form-row two-columns">
      <mat-form-field appearance="outline">
        <mat-label>Tipo de Notificación</mat-label>
        <mat-select formControlName="type">
          <mat-option *ngFor="let type of notificationTypes" [value]="type">
            {{type}}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Nivel de Confirmación</mat-label>
        <mat-select formControlName="acknowledgementLevel">
          <mat-option *ngFor="let level of acknowledgementLevels" [value]="level">
            {{level}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="isLoading">
    <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
    <span *ngIf="!isLoading">{{isEditMode ? 'Actualizar' : 'Crear'}}</span>
  </button>
</mat-dialog-actions>
