<!-- Quick Access Widget - Glassmorphism Premium Design -->
<div
  class="quick-access-card"
  [routerLink]="widget.route"
  [attr.aria-label]="'Acceder a ' + widget.title"
  role="button"
  tabindex="0"
  (keydown.enter)="onCardClick()"
  (keydown.space)="onCardClick()">

  <!-- Card Header with Icon and Count -->
  <div class="card-header">
    <div class="icon-container" [style.background]="getIconBackground()">
      <i [class]="'fas fa-' + widget.icon" [style.color]="widget.color" aria-hidden="true"></i>
    </div>
    <div class="count-display" [style.color]="widget.color">
      {{ widget.count | number }}
    </div>
  </div>

  <!-- Card Content -->
  <div class="card-content">
    <h3 class="card-title">{{ widget.title }}</h3>
    <p class="card-description">{{ widget.description }}</p>
  </div>

  <!-- Card Footer with Action -->
  <div class="card-footer">
    <span class="action-text">Ver ahora</span>
    <i class="fas fa-arrow-right action-icon" aria-hidden="true"></i>
  </div>

  <!-- Hover Effect Overlay -->
  <div class="hover-overlay" aria-hidden="true"></div>
</div>
