<div class="user-behavior-container">
  <div class="header">
    <h1>Análisis de Comportamiento de Usuarios</h1>
  </div>
  
  <!-- Indicador de carga -->
  <div *ngIf="isLoading" class="loading-overlay">
    <mat-spinner diameter="50"></mat-spinner>
    <span>Cargando datos...</span>
  </div>
  
  <!-- Filtros -->
  <mat-card class="filter-card">
    <mat-card-content>
      <form [formGroup]="filterForm" class="filter-form">
        <div class="filter-row">
          <div formGroupName="dateRange" class="date-range">
            <mat-form-field appearance="outline">
              <mat-label>Fecha desde</mat-label>
              <input matInput [matDatepicker]="startPicker" formControlName="startDate">
              <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
              <mat-datepicker #startPicker></mat-datepicker>
            </mat-form-field>
            
            <mat-form-field appearance="outline">
              <mat-label>Fecha hasta</mat-label>
              <input matInput [matDatepicker]="endPicker" formControlName="endDate">
              <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
              <mat-datepicker #endPicker></mat-datepicker>
            </mat-form-field>
          </div>
          
          <mat-form-field appearance="outline">
            <mat-label>Concurso</mat-label>
            <mat-select formControlName="contestId">
              <mat-option value="">Todos</mat-option>
              <mat-option value="1">Concurso 1</mat-option>
              <mat-option value="2">Concurso 2</mat-option>
              <mat-option value="3">Concurso 3</mat-option>
            </mat-select>
          </mat-form-field>
          
          <mat-form-field appearance="outline">
            <mat-label>Segmento de usuario</mat-label>
            <mat-select formControlName="userSegment">
              <mat-option value="">Todos</mat-option>
              <mat-option value="active-applicants">Postulantes Activos</mat-option>
              <mat-option value="occasional-users">Usuarios Ocasionales</mat-option>
              <mat-option value="abandoners">Abandonadores</mat-option>
            </mat-select>
          </mat-form-field>
          
          <mat-form-field appearance="outline">
            <mat-label>Rol de usuario</mat-label>
            <mat-select formControlName="userRole">
              <mat-option value="">Todos</mat-option>
              <mat-option value="ROLE_USER">Usuario</mat-option>
              <mat-option value="ROLE_ADMIN">Administrador</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        
        <div class="filter-actions">
          <button mat-stroked-button color="primary" (click)="resetFilters()">
            <mat-icon>refresh</mat-icon>
            Reiniciar
          </button>
          <button mat-raised-button color="primary" (click)="applyFilters()">
            <mat-icon>filter_list</mat-icon>
            Aplicar Filtros
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
  
  <!-- Pestañas de análisis -->
  <mat-card class="content-card">
    <mat-card-content>
      <mat-tab-group [(selectedIndex)]="activeTab" animationDuration="300ms" (selectedIndexChange)="onTabChange($event)">
        <!-- Pestaña de Embudo de Conversión -->
        <mat-tab label="Embudo de Conversión">
          <div class="tab-content">
            <app-inscription-funnel 
              [funnelData]="funnelData"
              [dropOffPoints]="dropOffPoints">
            </app-inscription-funnel>
          </div>
        </mat-tab>
        
        <!-- Pestaña de Análisis de Abandono -->
        <mat-tab label="Análisis de Abandono">
          <div class="tab-content">
            <app-drop-off-analysis 
              [dropOffPoints]="dropOffPoints">
            </app-drop-off-analysis>
          </div>
        </mat-tab>
        
        <!-- Pestaña de Tiempo por Etapa -->
        <mat-tab label="Tiempo por Etapa">
          <div class="tab-content">
            <app-step-time-analysis 
              [stepTimeMetrics]="stepTimeMetrics">
            </app-step-time-analysis>
          </div>
        </mat-tab>
        
        <!-- Pestaña de Uso de Funcionalidades -->
        <mat-tab label="Uso de Funcionalidades">
          <div class="tab-content">
            <app-feature-usage 
              [featureUsageData]="featureUsageData">
            </app-feature-usage>
          </div>
        </mat-tab>
        
        <!-- Pestaña de Segmentación de Usuarios -->
        <mat-tab label="Segmentación de Usuarios">
          <div class="tab-content">
            <app-user-segmentation 
              [userSegments]="userSegments">
            </app-user-segmentation>
          </div>
        </mat-tab>
      </mat-tab-group>
    </mat-card-content>
  </mat-card>
</div>
