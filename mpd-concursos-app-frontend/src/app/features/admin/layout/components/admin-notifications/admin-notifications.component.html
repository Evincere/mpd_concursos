<div class="notifications-container"
     (click)="$event.stopPropagation()"
     (keydown.escape)="closeNotifications()"
     tabindex="0"
     role="dialog"
     aria-label="Notificaciones">
  <!-- Header -->
  <div class="notifications-header">
    <h3 class="header-title">💬 Notificaciones</h3>
    <button
      class="mark-all-button"
      (click)="markAllAsRead()"
      [attr.aria-label]="'Marcar todas las notificaciones como leídas'"
    >
      <span class="btn-icon">✓</span>
      <span class="btn-label">Marcar todas como leídas</span>
    </button>
  </div>

  <div class="header-divider"></div>

  <!-- Lista de notificaciones -->
  <div class="notifications-list">
    <ng-container *ngIf="notifications.length > 0; else noNotifications">
      <div
        *ngFor="let notification of notifications"
        class="notification-item"
        [class.unread]="!notification.read"
        (click)="markAsRead(notification)"
        (keydown.enter)="markAsRead(notification)"
        (keydown.space)="markAsRead(notification)"
        tabindex="0"
        role="button"
        [attr.aria-label]="'Notificación: ' + notification.title"
      >
        <div class="notification-icon" [ngClass]="notification.type">
          <span class="icon-emoji">{{getNotificationIcon(notification.type)}}</span>
        </div>
        <div class="notification-content">
          <div class="notification-header">
            <h4 class="notification-title">{{notification.title}}</h4>
            <span class="notification-time">{{getTimeAgo(notification.timestamp)}}</span>
          </div>
          <p class="notification-message">{{notification.message}}</p>
          <div class="notification-actions">
            <a
              *ngIf="notification.link"
              [routerLink]="notification.link"
              class="notification-link"
              (click)="closeNotifications()"
            >
              <span class="link-icon">👁️</span>
              <span class="link-text">Ver detalles</span>
            </a>
            <span
              class="notification-status"
              [ngClass]="notification.read ? 'read' : 'unread'"
            >
              {{notification.read ? 'Leída' : 'Nueva'}}
            </span>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-template #noNotifications>
      <div class="no-notifications">
        <div class="empty-icon">🔕</div>
        <h4 class="empty-title">Sin notificaciones</h4>
        <p class="empty-message">No tienes notificaciones pendientes</p>
      </div>
    </ng-template>
  </div>

  <div class="footer-divider"></div>

  <!-- Footer -->
  <div class="notifications-footer">
    <a routerLink="/admin/comunicaciones/notificaciones" class="view-all-link" (click)="closeNotifications()">
      <span class="footer-icon">📋</span>
      <span class="footer-text">Ver todas las notificaciones</span>
    </a>
  </div>
</div>
