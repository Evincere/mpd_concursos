<div class="perfil-container dashboard-layout">
  <!-- Header Section -->
  <header class="perfil-header">
    <div class="header-content">
      <div class="header-title">
        <i class="fas fa-user-circle" aria-hidden="true"></i>
        <h1>Mi Perfil</h1>
      </div>
      <div class="header-actions" *ngIf="userProfile">
        <span class="user-info">
          <i class="fas fa-user" aria-hidden="true"></i>
          {{ userProfile.firstName }} {{ userProfile.lastName }}
        </span>
      </div>
    </div>
  </header>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-container">
    <app-custom-spinner></app-custom-spinner>
    <p>Cargando información del perfil...</p>
  </div>

  <!-- Main Content -->
  <div *ngIf="!isLoading" class="perfil-content">
    <!-- Tab Navigation -->
    <app-custom-tabs [(selectedIndex)]="selectedTabIndex" (tabChange)="onTabChange($event)">
      <app-custom-tab *ngFor="let tab of tabs"
        [key]="tab.key"
        [label]="tab.label"
        [icon]="tab.icon">

        <!-- Tab Content -->
        <div class="tab-content-wrapper">
          <ng-container [ngSwitch]="tab.key">

            <!-- Personal Information Tab -->
            <ng-container *ngSwitchCase="'info'">
              <div class="personal-info-section">
                <app-perfil-personal-info
                  [userProfile]="userProfile"
                  [perfilForm]="perfilForm"
                  [isEditing]="isEditing"
                  [isLoading]="isLoading"
                  (editToggle)="onEditToggle()"
                  (formSave)="onFormSave()"
                  (formReset)="onFormReset()">
                </app-perfil-personal-info>
              </div>
            </ng-container>

            <!-- CV Tab -->
            <ng-container *ngSwitchCase="'cv'">
              <div class="cv-section">
                <app-perfil-cv
                  [userProfile]="userProfile"
                  [experiencias]="experiencias.controls"
                  [educacionList]="educacionList"
                  [isLoading]="isLoading"
                  (addExperience)="agregarExperiencia()"
                  (addEducation)="agregarEducacion()"
                  (deleteExperience)="eliminarExperiencia($event)"
                  (deleteEducation)="eliminarEducacion($event)">
                </app-perfil-cv>
              </div>
            </ng-container>

            <!-- Documentation Tab -->
            <ng-container *ngSwitchCase="'docs'">
              <div class="documentation-section">
                <app-documentacion-tab></app-documentacion-tab>
              </div>
            </ng-container>

            <!-- LinkedIn Tab -->
            <ng-container *ngSwitchCase="'linkedin'">
              <div class="linkedin-section" *ngIf="linkedInTab">
                <app-perfil-linkedin
                  [linkedInConectado]="linkedInConectado"
                  [userProfile]="userProfile">
                </app-perfil-linkedin>
              </div>
            </ng-container>

          </ng-container>
        </div>
      </app-custom-tab>
    </app-custom-tabs>
  </div>

  <!-- Modals Section -->
  <div class="modals-container">
    <!-- Education Modal -->
    <div *ngIf="mostrarModalEducacion && userProfile && userProfile.id" class="modal-overlay">
      <div class="modal-container">
        <app-educacion-container
          [usuarioId]="usuarioId"
          (educacionGuardada)="onEducacionGuardada($event)"
          (cerrar)="cerrarModalEducacion()">
        </app-educacion-container>
      </div>
    </div>

    <!-- Experience Modal -->
    <div *ngIf="mostrarModalExperiencia && esIdUsuarioValido()" class="modal-overlay">
      <div class="modal-container">
        <app-experiencia-container
          [usuarioId]="usuarioId"
          (experienciaGuardada)="onExperienciaGuardada($event)"
          (cerrar)="mostrarModalExperiencia = false">
        </app-experiencia-container>
      </div>
    </div>
  </div>
</div>
