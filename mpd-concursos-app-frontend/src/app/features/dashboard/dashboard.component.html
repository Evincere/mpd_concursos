<div class="dashboard-layout">
    <app-navbar [isSidebarCollapsed]="isSidebarCollapsed"></app-navbar>
    <div class="dashboard-container" [class.sidebar-collapsed]="isSidebarCollapsed">
        <app-sidebar
            *ngIf="!isMobile || !isSidebarCollapsed"
            [class.collapsed]="isSidebarCollapsed"
            (sidebarCollapsed)="onSidebarCollapse($event)">
        </app-sidebar>
        <main class="dashboard-content" [class.sidebar-collapsed]="isSidebarCollapsed" [class.mobile-view]="isMobile">
            <router-outlet></router-outlet>
        </main>
    </div>
    <app-mobile-nav *ngIf="isMobile"></app-mobile-nav>
</div>
