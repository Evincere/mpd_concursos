<div class="navbar">
    <a href="https://defensamendoza.gob.ar/" target="_blank" rel="noopener noreferrer"
       class="logo-container" [class.collapsed]="isSidebarCollapsed">
        <img src="assets/images/mpd-logo.png"
             (error)="onLogoError($event)"
             alt="Logo Ministerio Público de la Defensa"
             [@logoRotate]="logoState">
    </a>
    <h1 class="navbar-title" [class.collapsed]="isSidebarCollapsed">Defensa Mendoza</h1>

    <!-- El botón para ir al panel de administración ahora está en el indicador de sección -->

    <div class="nav-right">
        <app-notifications></app-notifications>
        <app-user-info></app-user-info>
        <button class="logout-btn" (click)="onLogout()" (keydown.enter)="onLogout()" (keydown.space)="onLogout()" aria-label="Cerrar sesión">
            <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
            <span class="logout-text">Cerrar sesión</span>
        </button>
    </div>
</div>
