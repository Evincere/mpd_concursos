<main class="main-content">
    <!-- Cards principales -->
    <app-cards [cards]="cards"></app-cards>

    <!-- Widgets premium del dashboard -->
    <div class="widgets-premium" *ngIf="simpleDashboardData">
      <div class="widgets-row-1">
        <app-estado-perfil-widget
          [dashboardData]="simpleDashboardData"
          class="widget-estado-perfil">
        </app-estado-perfil-widget>

        <app-proximos-vencimientos-widget
          [dashboardData]="simpleDashboardData"
          class="widget-vencimientos">
        </app-proximos-vencimientos-widget>
      </div>

      <div class="widgets-row-2">
        <app-acciones-rapidas-widget
          [dashboardData]="simpleDashboardData"
          class="widget-acciones">
        </app-acciones-rapidas-widget>
      </div>
    </div>

    <!-- Sección de concursos recientes -->
    <div class="recent-contests-section">
        <app-recent-section [recentConcursos]="recentConcursos"></app-recent-section>
    </div>
</main>
