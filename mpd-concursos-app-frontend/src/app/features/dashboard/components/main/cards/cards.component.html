<div class="dashboard-cards">
    <div *ngFor="let card of cards; trackBy: trackByCard"
         class="card"
         [attr.data-card-type]="card.title"
         [style.border-left]="'4px solid ' + card.color">
        <div class="card-content">
            <div class="card-info">
                <h3>{{card.title}}</h3>
                <span class="count">{{card.count}}</span>
                <span class="subtitle" *ngIf="card.subtitle">{{card.subtitle}}</span>
            </div>
            <i class="fas {{card.icon}} card-icon" [style.color]="card.color"></i>
        </div>
    </div>
</div>
