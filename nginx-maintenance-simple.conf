server {
    listen 80;
    server_name localhost;
    
    # Configuración general
    client_max_body_size 5M;
    
    # Headers de seguridad básicos
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # API - solo para administradores (puedes cambiar las IPs según necesidad)
    location /api/ {
        # Permitir solo IPs administrativas
        allow 127.0.0.1;
        allow 172.20.0.0/16;  # Red Docker interna
        allow 149.50.132.23;  # IP del servidor
        deny all;
        
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers para API administrativa
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "maintenance mode - healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Para todas las demás rutas, mostrar página de mantenimiento
    location / {
        root /usr/share/nginx/html/maintenance;
        try_files $uri /maintenance.html;
        
        # Headers para evitar caché
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # Denegar acceso a archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
