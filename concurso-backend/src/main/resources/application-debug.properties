# Configuración específica para debugging de versioning
# Solo activa cuando se ejecuta con perfil 'debug'

# Logging SQL detallado
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.engine.internal.Versioning=DEBUG
logging.level.org.hibernate.event.internal=DEBUG

# Mostrar SQL formateado en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging específico para nuestro debugging
logging.level.ar.gov.mpd.concursobackend.document=DEBUG
logging.level.ar.gov.mpd.concursobackend.document.infrastructure.debug=ERROR

# Configuración de consola para mejor visibilidad
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n

# Habilitar estadísticas de Hibernate
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG

# Configuración adicional para debugging
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=0

# Configuración de archivo de log específico para versioning
logging.level.VERSIONING_DEBUG=ERROR
logging.file.name=./logs/application-debug.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5

# Configuración adicional para ver logs de versioning en consola
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n
