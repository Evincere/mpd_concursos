# ConfiguraciÃ³n especÃ­fica para el perfil "dev"

# ConfiguraciÃ³n del servidor
server.port=8080

# Base de datos en memoria para desarrollo local
spring.datasource.url=jdbc:mysql://localhost:3306/mpd_concursos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true
# SECURITY: Usar variables de entorno para credenciales sensibles
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuración de JPA para desarrollo
# DESARROLLO: Permitir update solo en desarrollo local (NUNCA en producción)
spring.jpa.hibernate.ddl-auto=update
# Habilitar generación automática solo en desarrollo
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Configuraciones adicionales para estabilidad
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# Configuraciones para manejar foreign keys de forma ordenada
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=false
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Configuración UTF-8 para soportar emojis (la tabla ya está configurada como utf8mb4)

# ConfiguraciÃ³n de logs para modo desarrollo
logging.level.root=INFO

# Logging específico por componentes de la aplicación
logging.level.ar.gov.mpd.concursobackend=INFO
logging.level.ar.gov.mpd.concursobackend.contest=DEBUG
logging.level.ar.gov.mpd.concursobackend.inscription=DEBUG
logging.level.ar.gov.mpd.concursobackend.shared.infrastructure.security=DEBUG
logging.level.ar.gov.mpd.concursobackend.shared.infrastructure.exception=DEBUG

# Logging de frameworks
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging específico para auditoría de seguridad (Punto 12)
logging.level.ar.gov.mpd.concursobackend.inscription.application.service.CreateInscriptionService=DEBUG
logging.level.ar.gov.mpd.concursobackend.contest.application.service.CreateContestInscriptionService=DEBUG
logging.level.ar.gov.mpd.concursobackend.shared.infrastructure.exception.GlobalExceptionHandler=DEBUG

# Patrón de logs más detallado para desarrollo
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Configuración de archivo de log
logging.file.name=./logs/application-dev.log
# logging.pattern.file ya está configurado arriba (línea 48)

# UbicaciÃ³n de almacenamiento de documentos para desarrollo
app.document.storage.location=./document-storage-dev

# Configuraciones especÃ­ficas para desarrollo
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Activar Stack Trace completo
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always

# Configuración CORS
# NOTA: CORS se configura programáticamente en SecurityConfig.java usando estas propiedades válidas
# Las propiedades spring.mvc.cors.* NO son válidas en Spring Boot

# Propiedades CORS válidas para desarrollo
app.cors.allowed-origins=http://localhost:4200,http://localhost:8000,http://127.0.0.1:4200,http://127.0.0.1:8000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.max-age=3600

# ConfiguraciÃ³n de URL base para desarrollo local
app.base-url=http://localhost:8080

# ConfiguraciÃ³n de logging especÃ­fico para imÃ¡genes de perfil
logging.level.ar.gov.mpd.concursobackend.file=DEBUG
logging.level.ar.gov.mpd.concursobackend.auth.application.service.ProfileImageService=DEBUG

# ConfiguraciÃ³n para la inicializaciÃ³n de la base de datos
# DESHABILITAR schema.sql Y data.sql para evitar conflictos con Hibernate
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
# Configuración movida a sección principal arriba
# Asegurar que Hibernate termine completamente antes de ejecutar CommandLineRunners
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
# order_inserts y order_updates ya están configurados arriba (líneas 22-23)

# =============================================================================
# CONFIGURACIÃ“N DE LOGGING PARA DEBUGGING
# =============================================================================
# logging.level.org.springframework.web=DEBUG  # DUPLICADO - ya configurado en línea 36
# logging.level.org.springframework.security=DEBUG  # DUPLICADO - ya configurado en línea 37
# logging.level.ar.gov.mpd.concursobackend=DEBUG  # DUPLICADO - ya configurado en línea 29
# logging.level.org.hibernate.SQL=DEBUG  # DUPLICADO - ya configurado en línea 38
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE  # DUPLICADO - ya configurado en línea 39
# Logging adicional para debugging de creaciÃ³n de tablas
logging.level.org.hibernate.tool.hbm2ddl=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.hibernate.engine.jdbc.env.internal.LobCreatorBuilderImpl=WARN

# Configuración de diagnóstico de seguridad (solo desarrollo)
# Habilita el SecurityDiagnosticController para debugging de configuración de seguridad
app.security.diagnostic.enabled=true