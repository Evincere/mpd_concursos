# Configuración para testing rápido con H2
# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (para debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway deshabilitado para testing rápido
spring.flyway.enabled=false

# Logging
logging.level.ar.gov.mpd.concursobackend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Inicialización de datos
app.data.initialization.enabled=true
app.data.initialization.create-test-data=true

# JWT
app.jwt.secret=test-secret-key-for-testing-only-not-for-production-use
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:4200
