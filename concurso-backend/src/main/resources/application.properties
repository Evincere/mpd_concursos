# Perfil activo por defecto (desarrollo local) - USAR CONFIGURACIÓN PRINCIPAL
spring.profiles.active=dev

# Hibernate Configuration
# Las configuraciones de JPA/Hibernate se han consolidado en la sección "JPA settings"
spring.jpa.show-sql=true

# Server Configuration
server.port=8080
server.error.include-stacktrace=always
server.error.include-message=always

# JWT Configuration - PRODUCTION READY
# DESARROLLO: Clave temporal para desarrollo (256 bits mínimo)
jwt.secret=${JWT_SECRET:dev_jwt_secret_key_for_development_only_minimum_256_bits_required_do_not_use_in_production_environment}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging - PRODUCTION READY
logging.level.ar.gov.mpd.concursobackend=${LOG_LEVEL:DEBUG}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_LOG_LEVEL:WARN}

# JPA settings
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.CharSet=utf8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Configuraci�n movida a secci�n principal arriba

# Configuraci�n CORS
# NOTA: Las propiedades spring.mvc.cors.* NO son v�lidas en Spring Boot
# CORS se configura program�ticamente en SecurityConfig.java usando estas propiedades v�lidas:

# Propiedades CORS v�lidas (se sobrescriben en cada entorno)
app.cors.allowed-origins=http://localhost:4200,http://localhost:8000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.max-age=3600

# Configuración de MySQL - PRODUCTION READY
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mpd_concursos}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
# PRODUCCIÓN: Credenciales para servidor remoto
# SECURITY: Variables de entorno obligatorias para credenciales
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACI�N SEGURA: Validar esquema por defecto (no modificar)
spring.jpa.hibernate.ddl-auto=validate
# Deshabilitar generaci�n autom�tica por defecto (seguridad)
spring.jpa.generate-ddl=false
# DESHABILITADO: data.sql deshabilitado intencionalmente
# spring.sql.init.mode=always

# Configuración de Hikari Pool
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-test-query=SELECT 1

# DESHABILITADO: data.sql deshabilitado intencionalmente (archivo renombrado a .disabled)
spring.sql.init.mode=never
spring.sql.init.schema-locations=
spring.sql.init.data-locations=
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=false

# Flyway Configuration - ENABLED for database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
# Configuración adicional para debugging
spring.jpa.show-sql=true
logging.level.org.springframework.jdbc.datasource.init=DEBUG
spring.sql.init.separator=;
spring.sql.init.encoding=UTF-8

# =============================================================================
# CONFIGURACI�N DE ALMACENAMIENTO UNIFICADO
# =============================================================================
# Sistema de almacenamiento centralizado para todos los tipos de archivos

# Configuraci�n base del almacenamiento
app.storage.base-dir=./storage
app.storage.documents-dir=documents
app.storage.contest-bases-dir=contest-bases
app.storage.cv-documents-dir=cv-documents
app.storage.profile-images-dir=profile-images
app.storage.temp-dir=temp

# Configuraci�n de multipart para subida de archivos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.resolve-lazily=true

# Configuraci�n legacy (mantenida para compatibilidad)
app.document.storage.location=${app.storage.base-dir}/${app.storage.documents-dir}
app.file.upload-dir=${app.storage.base-dir}
app.file.contest-bases-dir=${app.storage.contest-bases-dir}
app.cv.document.storage.location=${app.storage.base-dir}/${app.storage.cv-documents-dir}
app.cv.document.temp-dir=${app.storage.base-dir}/${app.storage.temp-dir}

# Configuraci�n de limpieza de archivos temporales
app.document.temp.cleanup.interval=3600
app.document.temp.max.age=86400

# Configuraci�n de la cola de procesamiento de documentos
app.document.queue.max.age=3600000
app.document.queue.max.size=1000

# Configuraci�n de archivos CV
app.cv.document.max-size=10MB
app.cv.document.allowed-types=application/pdf,image/jpeg,image/png,image/jpg

# Configuraci�n de URL base para im�genes de perfil
app.base-url=http://149.50.132.23:8080

# Configuraci�n de Flyway - COMPLETAMENTE DESHABILITADO
spring.flyway.enabled=false
# Flyway deshabilitado - usando schema.sql �nicamente

# =============================================================================
# CONFIGURACIÓN DE NAMING STRATEGY - AGREGADO PARA RESOLVER PROBLEMAS DE PRODUCCIÓN
# =============================================================================
# Estas configuraciones aseguran que los nombres de tabla generados por JPA
# coincidan exactamente con los definidos en schema.sql
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# =============================================================================
# CONFIGURACIÓN UUID PARA COMPATIBILIDAD CON MYSQL BINARY(16)
# =============================================================================
# Configuración específica para que los UUID de JPA sean compatibles
# con el tipo BINARY(16) generado automáticamente por Hibernate
spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=single_table

# =============================================================================
# CONFIGURACIÓN PARA RESOLVER ERRORES SQL CON BACKTICKS
# =============================================================================
# Configuración para evitar errores de sintaxis SQL con backticks incorrectos
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.properties.hibernate.auto_quote_keyword=false
spring.jpa.properties.hibernate.format_sql=false
# Configuración específica para MySQL y backticks
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.implicit_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
# Configuración adicional para evitar backticks en tipos de datos
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true

# =============================================================================
# CAMBIO IMPLEMENTADO: HIBERNATE AUTO-DDL (2025-01-27)
# =============================================================================
# ANTES: Usaba schema.sql manual (desactualizado, causaba inconsistencias)
# AHORA: Hibernate crea automáticamente el esquema basado en entidades JPA
# VENTAJAS:
# - Entidades JPA son la única fuente de verdad
# - No hay riesgo de desincronización entre schema.sql y entidades
# - Cambios en entidades se reflejan automáticamente en BD
# - Consistencia entre desarrollo y producción
# CONFIGURACIÓN:
# - spring.jpa.hibernate.ddl-auto=create-drop (recrea BD en cada inicio)
# - spring.jpa.generate-ddl=true (permite generación automática)
# - schema.sql DESHABILITADO (comentado)
# - data.sql HABILITADO (solo para datos de prueba)

# Configuraci�n CORS por defecto (desarrollo local)
app.cors.allowed-origins=http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.max-age=3600

# Configuración de diagnóstico de seguridad (por defecto deshabilitado)
app.security.diagnostic.enabled=false

# =============================================================================
# CONFIGURACIÓN DE NOTIFICACIONES
# =============================================================================
# Sistema de notificaciones - Desactivado temporalmente debido a problemas de concurrencia
app.notifications.enabled=false
app.notifications.state-change.enabled=false
