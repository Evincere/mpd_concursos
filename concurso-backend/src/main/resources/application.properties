spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Configuraci髇 movida a secci髇 principal arriba

# Configuraci髇 CORS
# NOTA: Las propiedades spring.mvc.cors.* NO son v醠idas en Spring Boot
# CORS se configura program醫icamente en SecurityConfig.java usando estas propiedades v醠idas:

# Propiedades CORS v醠idas (se sobrescriben en cada entorno)
app.cors.allowed-origins=http://localhost:4200,http://localhost:8000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.max-age=3600

# Configuraci贸n de MySQL - PRODUCTION READY
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mpd_concursos}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
# PRODUCCI脫N: Credenciales para servidor remoto
# SECURITY: Variables de entorno obligatorias para credenciales
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACI覰 SEGURA: Validar esquema por defecto (no modificar)
spring.jpa.hibernate.ddl-auto=validate
# Deshabilitar generaci髇 autom醫ica por defecto (seguridad)
spring.jpa.generate-ddl=false
# DESHABILITADO: data.sql deshabilitado intencionalmente
# spring.sql.init.mode=always

# Configuraci贸n de Hikari Pool
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-test-query=SELECT 1

# DESHABILITADO: data.sql deshabilitado intencionalmente (archivo renombrado a .disabled)
spring.sql.init.mode=never
spring.sql.init.schema-locations=
spring.sql.init.data-locations=
