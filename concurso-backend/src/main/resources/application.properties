# Perfil activo por defecto (desarrollo local)
spring.profiles.active=dev

# Hibernate Configuration
# Las configuraciones de JPA/Hibernate se han consolidado en la sección "JPA settings"
spring.jpa.show-sql=true

# Server Configuration
server.port=8080
server.error.include-stacktrace=always
server.error.include-message=always

# JWT Configuration - PRODUCTION READY
# DESARROLLO: Clave temporal para desarrollo (256 bits mínimo)
jwt.secret=${JWT_SECRET:dev_jwt_secret_key_for_development_only_minimum_256_bits_required_do_not_use_in_production_environment}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging - PRODUCTION READY
logging.level.ar.gov.mpd.concursobackend=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_LOG_LEVEL:WARN}

# JPA settings
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.CharSet=utf8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true

# Configuración CORS
spring.mvc.cors.allowed-origins=http://149.50.132.23:8000,https://149.50.132.23:8000,http://localhost:4200,http://localhost:8000
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
spring.mvc.cors.max-age=3600

# Configuración de MySQL - PRODUCTION READY
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mpd_concursos}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
# DESARROLLO: Credenciales temporales para desarrollo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# DEVELOPMENT: Usar solo schema.sql
spring.jpa.hibernate.ddl-auto=none

# Configuración de Hikari Pool
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-test-query=SELECT 1

# Habilitar scripts SQL para crear tablas faltantes - FORZAR RECREACIÓN
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true
# Configuración adicional para debugging
spring.jpa.show-sql=true
logging.level.org.springframework.jdbc.datasource.init=DEBUG
spring.sql.init.separator=;
spring.sql.init.encoding=UTF-8

# Configuración para el almacenamiento de documentos
app.document.storage.location=./document-storage
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.resolve-lazily=true

# Configuración de limpieza de archivos temporales
app.document.temp.cleanup.interval=3600
app.document.temp.max.age=86400

# Configuración de la cola de procesamiento de documentos
app.document.queue.max.age=3600000
app.document.queue.max.size=1000

# Configuración de Flyway para migraciones (deshabilitado temporalmente)
spring.flyway.enabled=false
# spring.flyway.baseline-on-migrate=true
# spring.flyway.locations=classpath:db/migration
# spring.flyway.table=flyway_schema_history
# spring.flyway.baseline-version=0
# spring.flyway.schemas=mpd_concursos

# Configuración de archivos de concursos
app.file.upload-dir=uploads
app.file.contest-bases-dir=contest-bases

# =============================================================================
# CONFIGURACIÓN DE NAMING STRATEGY - AGREGADO PARA RESOLVER PROBLEMAS DE PRODUCCIÓN
# =============================================================================
# Estas configuraciones aseguran que los nombres de tabla generados por JPA
# coincidan exactamente con los definidos en schema.sql
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# =============================================================================
# CONFIGURACIÓN UUID PARA COMPATIBILIDAD CON MYSQL BINARY(16)
# =============================================================================
# Configuración específica para que los UUID de JPA sean compatibles
# con el tipo BINARY(16) definido en schema.sql
spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=single_table