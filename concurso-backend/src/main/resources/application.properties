# Hibernate Configuration
# Las configuraciones de JPA/Hibernate se han consolidado en la secci贸n "JPA settings"
spring.jpa.show-sql=true

# Server Configuration
server.port=8080
server.error.include-stacktrace=always
server.error.include-message=always

# JWT Configuration - PRODUCTION READY
# DESARROLLO: Clave temporal para desarrollo (256 bits m铆nimo)
jwt.secret=${JWT_SECRET:dev_jwt_secret_key_for_development_only_minimum_256_bits_required_do_not_use_in_production_environment}
