# Configuración de MySQL para producción (servidor cloud)
spring.datasource.url=jdbc:mysql://mysql:3306/mpd_concursos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración CORS para producción
spring.mvc.cors.allowed-origins=http://149.50.132.23:8000,https://149.50.132.23:8000,http://localhost:4200,http://localhost:8000
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
spring.mvc.cors.max-age=3600

# Configuración para el esquema de base de datos en producción
spring.jpa.hibernate.ddl-auto=validate
# Usar la misma naming strategy que en desarrollo para consistencia
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# DESHABILITADO: Scripts SQL para evitar creación automática de usuarios de prueba
# CONFIGURABLE: Usar variable de entorno LOAD_TEST_DATA=true para habilitar datos de prueba
spring.sql.init.mode=never
# spring.sql.init.schema-locations=classpath:schema.sql  # NO usar schema.sql
# spring.sql.init.data-locations=classpath:data.sql  # DESHABILITADO

# Configuración para el almacenamiento de documentos en producción
app.document.storage.location=document-storage

# Configuración de URL base para producción
app.base-url=http://149.50.132.23:8080

# Configuración de logging para producción (menos verbose)
logging.level.ar.gov.mpd.concursobackend.file=INFO
logging.level.ar.gov.mpd.concursobackend.auth.application.service.ProfileImageService=INFO

# Configuración de seguridad para producción
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never