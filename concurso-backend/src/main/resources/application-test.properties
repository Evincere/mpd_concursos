# ConfiguraciÃ³n para tests de integraciÃ³n
spring.datasource.url=jdbc:mysql://localhost:3306/mpd_concursos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# SECURITY: Variables de entorno para testing
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:test1234}

# Configuración de JPA para testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false

# Configuración CORS para testing (más permisiva para tests)
app.cors.allowed-origins=http://localhost:4200,http://localhost:8000,http://127.0.0.1:4200,http://127.0.0.1:8000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
app.cors.max-age=1800

# Configuración de diagnóstico de seguridad para testing
app.security.diagnostic.enabled=true