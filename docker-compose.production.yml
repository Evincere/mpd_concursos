# Docker Compose para producción con SSL - MPD Concursos
# PRESERVA VOLUMENES CRÍTICOS: mpd_concursos_mysql_data_prod y mpd_concursos_storage_data_prod

services:
  # Nginx Proxy con SSL
  nginx-proxy:
    image: nginx:stable-alpine
    container_name: mpd-concursos-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl-setup/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl-setup/certbot/conf:/etc/letsencrypt:ro
      - ./ssl-setup/certbot/www:/var/www/certbot:ro
      - mpd_concursos_nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - mpd-concursos-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Certbot para certificados SSL
  certbot:
    image: certbot/certbot:latest
    container_name: mpd-concursos-certbot
    volumes:
      - ./ssl-setup/certbot/conf:/etc/letsencrypt
      - ./ssl-setup/certbot/www:/var/www/certbot
      - ./ssl-setup/certbot/logs:/var/log/letsencrypt
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN}
    depends_on:
      - nginx-proxy
    networks:
      - mpd-concursos-network

  # MySQL Database - PRESERVANDO DATOS CRÍTICOS
  mysql:
    image: mysql:8.0
    container_name: mpd-concursos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mpd_concursos}
      MYSQL_USER: ${MYSQL_USER:-mpd_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mpd_password}
    ports:
      - "3307:3306"
    volumes:
      # CRÍTICO: Usar el mismo volumen existente
      - mpd_concursos_mysql_data_prod:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    networks:
      - mpd-concursos-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend Spring Boot - PRESERVANDO DOCUMENTOS DE USUARIOS
  backend:
    build:
      context: ./concurso-backend
      dockerfile: Dockerfile
    container_name: mpd-concursos-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Variables de base de datos
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-mpd_concursos}
      DB_USERNAME: ${MYSQL_USER:-mpd_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-mpd_password}
      # Variables de configuración JPA
      HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_SQL_INIT_MODE: never
      # Variables de seguridad
      JWT_SECRET: ${JWT_SECRET:-production_jwt_secret_key_change_this_in_production_environment_minimum_256_bits_required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # Configuración CORS para HTTPS
      SPRING_MVC_CORS_ALLOWED_ORIGINS: https://${DOMAIN},http://${DOMAIN},https://${SERVER_HOST}:8000,http://${SERVER_HOST}:8000
      # Configuración de servidor
      SERVER_PORT: 8080
      CONTEXT_PATH: ""
      # Configuración de pool de base de datos
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MIN_IDLE: 5
      DB_CONNECTION_TIMEOUT: 30000
      DB_IDLE_TIMEOUT: 600000
      DB_MAX_LIFETIME: 1800000
      # Configuración de memoria Java
      JAVA_OPTS: "${JAVA_OPTS:--Xmx1g -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200}"
      # Configuración de logging
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_AR_GOV_MPD: INFO
      # Configuración de multipart files para uploads
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 20MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 25MB
      SPRING_SERVLET_MULTIPART_ENABLED: "true"
      # Configuración de timeouts del servidor
      SERVER_TOMCAT_CONNECTION_TIMEOUT: 300000
      SPRING_MVC_ASYNC_REQUEST_TIMEOUT: 300000
      # Configuración adicional de Tomcat
      SERVER_TOMCAT_MAX_HTTP_POST_SIZE: 25MB
    ports:
      - "8080:8080"
    volumes:
      # CRÍTICO: Usar el mismo volumen existente para documentos
      - mpd_concursos_storage_data_prod:/app/storage
      - backup_data_prod:/app/backups
      - ./logs:/app/logs
      - ./scripts:/app/scripts:ro
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'
    networks:
      - mpd-concursos-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Angular
  frontend:
    build:
      context: ./mpd-concursos-app-frontend
      dockerfile: Dockerfile
    container_name: mpd-concursos-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    networks:
      - mpd-concursos-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  # VOLÚMENES CRÍTICOS - DEBEN PRESERVARSE
  mpd_concursos_mysql_data_prod:
    external: true
  mpd_concursos_storage_data_prod:
    external: true
  # Nuevos volúmenes
  backup_data_prod:
    driver: local
  mpd_concursos_nginx_logs:
    driver: local

networks:
  mpd-concursos-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
