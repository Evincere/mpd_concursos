version: '3.8'

# ARCHIVO DE EJEMPLO - NO USAR DIRECTAMENTE EN PRODUCCIÓN
# Copiar a docker-compose.ssl.yml y configurar con valores reales

services:
  mysql:
    image: mysql:8.0
    container_name: mpd-concursos-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "concursos_bd"
      MYSQL_ROOT_PASSWORD: "CHANGE_ME_MYSQL_ROOT_PASSWORD"
      MYSQL_USER: "CHANGE_ME_MYSQL_USER"
      MYSQL_PASSWORD: "CHANGE_ME_MYSQL_PASSWORD"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./storage:/storage
    networks:
      - mpd-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./concurso-backend
      dockerfile: Dockerfile
    container_name: mpd-concursos-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/concursos_bd"
      SPRING_DATASOURCE_USERNAME: "CHANGE_ME_MYSQL_USER"
      SPRING_DATASOURCE_PASSWORD: "CHANGE_ME_MYSQL_PASSWORD"
      JWT_SECRET: "CHANGE_ME_JWT_SECRET_KEY_MINIMUM_32_CHARS"
      SMTP_HOST: "CHANGE_ME_SMTP_HOST"
      SMTP_PORT: "587"
      SMTP_USERNAME: "CHANGE_ME_SMTP_USER"
      SMTP_PASSWORD: "CHANGE_ME_SMTP_PASSWORD"
    volumes:
      - ./storage:/storage
    networks:
      - mpd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./mpd-concursos-app-frontend
      dockerfile: Dockerfile
    container_name: mpd-concursos-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mpd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx-proxy:
    image: nginx:stable-alpine
    container_name: mpd-concursos-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - mpd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
    driver: local

networks:
  mpd-network:
    driver: bridge

# INSTRUCCIONES DE CONFIGURACIÓN:
# 1. Copiar este archivo a docker-compose.ssl.yml
# 2. Reemplazar todos los valores CHANGE_ME_ con valores reales
# 3. Configurar certificados SSL en /etc/letsencrypt
# 4. Ajustar nginx-proxy.conf para SSL
# 5. Nunca commitear docker-compose.ssl.yml al repositorio
