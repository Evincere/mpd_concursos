# Docker Compose para producción - MPD Concursos
# Nota: version removido para compatibilidad con versiones recientes de Docker Compose

services:
  mysql:
    image: mysql:8.0
    container_name: mpd-concursos-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mpd_concursos}
      MYSQL_USER: ${MYSQL_USER:-mpd_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mpd_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    networks:
      - mpd-concursos-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./concurso-backend
      dockerfile: Dockerfile
    container_name: mpd-concursos-backend-prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Variables de base de datos
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-mpd_concursos}
      DB_USERNAME: ${MYSQL_USER:-mpd_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-mpd_password}
      # Variables de configuración JPA
      HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_SQL_INIT_MODE: never
      # Variables de seguridad
      JWT_SECRET: ${JWT_SECRET:-production_jwt_secret_key_change_this_in_production_environment_minimum_256_bits_required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # Configuración CORS
      SPRING_MVC_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://vps-4778464-x.dattaweb.com,https://149.50.132.23:8000,http://149.50.132.23:8000}
      # Configuración de servidor
      SERVER_PORT: 8080
      CONTEXT_PATH: ""
      # Configuración de pool de base de datos
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MIN_IDLE: 5
      DB_CONNECTION_TIMEOUT: 30000
      DB_IDLE_TIMEOUT: 600000
      DB_MAX_LIFETIME: 1800000
      # Configuración de memoria Java
      JAVA_OPTS: "${JAVA_OPTS:--Xmx1g -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200}"
      # Configuración de logging
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_AR_GOV_MPD: INFO
      # Configuración de multipart files para uploads
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 20MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 25MB
      SPRING_SERVLET_MULTIPART_ENABLED: "true"
      # Configuración de timeouts del servidor
      SERVER_TOMCAT_CONNECTION_TIMEOUT: 300000
      SPRING_MVC_ASYNC_REQUEST_TIMEOUT: 300000
      # Configuración adicional de Tomcat
      SERVER_TOMCAT_MAX_HTTP_POST_SIZE: 25MB
    ports:
      - "8080:8080"
    volumes:
      - storage_data_prod:/app/document-storage
      - backup_data_prod:/app/backups
      - ./logs:/app/logs
      - ./scripts:/app/scripts:ro
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'
    networks:
      - mpd-concursos-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./mpd-concursos-app-frontend
      dockerfile: Dockerfile
    container_name: mpd-concursos-frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8000:80"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    networks:
      - mpd-concursos-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    #     healthcheck:
    #       test: ["CMD", "curl", "-f", "http://localhost:80/health"]
    #       interval: 30s
    #       timeout: 10s
    #       retries: 3
    #       start_period: 30s

volumes:
  mysql_data_prod:
    driver: local
  storage_data_prod:
    driver: local
  backup_data_prod:
    driver: local

networks:
  mpd-concursos-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
