# Plantilla de docker-compose SSL usando imágenes por tag (sin builds)
# Objetivo: normalizar el despliegue durante ventana de mantenimiento,
#           evitando reconstrucciones y fijando versiones explícitas.
# Uso sugerido:
#   1) Ajustar los tags en 'image:' según el release (ej.: deploy-YYYY-MM-DD-ssl)
#   2) Respaldar el compose actual si fuera necesario
#   3) Usar este archivo en reemplazo de docker-compose.ssl.yml junto con el script
#      ./scripts/deploy-production.sh (puede requerir un pequeño ajuste para apuntar a este archivo)
#   4) Alternativamente, portar estos cambios (image: y remover build:) a docker-compose.ssl.yml

version: '3.8'

services:
  # Nginx Proxy con SSL (sin cambios)
  nginx-proxy:
    image: nginx:stable-alpine
    container_name: mpd-concursos-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl-setup/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl-setup/certbot/conf:/etc/letsencrypt:ro
      - ./ssl-setup/certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - mpd-concursos-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Certbot para certificados SSL (sin cambios)
  certbot:
    image: certbot/certbot:latest
    container_name: mpd-concursos-certbot
    volumes:
      - ./ssl-setup/certbot/conf:/etc/letsencrypt
      - ./ssl-setup/certbot/www:/var/www/certbot
      - ./ssl-setup/certbot/logs:/var/log/letsencrypt
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN}
    depends_on:
      - nginx-proxy
    networks:
      - mpd-concursos-network

  # MySQL Database (sin cambios)
  mysql:
    image: mysql:8.0
    container_name: mpd-concursos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mpd_concursos}
      MYSQL_USER: ${MYSQL_USER:-mpd_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mpd_password}
    volumes:
      - mpd_concursos_mysql_data_prod:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    networks:
      - mpd-concursos-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend Spring Boot (cambiado a image:, build removido)
  backend:
    # Ajustar el tag al del release (por ejemplo, el tag de Git 'deploy-2025-08-11-ssl')
    image: mpd_concursos_backend:deploy-2025-08-11-ssl
    # build:        # REMOVIDO: usar imágenes preconstruidas y etiquetadas
    container_name: mpd-concursos-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mpd_concursos}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-mpd_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-mpd_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_SQL_INIT_MODE: never
      SPRING_MVC_CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      JAVA_OPTS: "-Xmx1g -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
      SERVER_PORT: 8080
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_AR_GOV_MPD: INFO
    volumes:
      - mpd_concursos_storage_data_prod:/app/storage
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'
    networks:
      - mpd-concursos-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Angular (cambiado a image:, build removido)
  frontend:
    # Sugerencia: alinear tag del frontend con el release (p.ej., deploy-2025-08-11-ssl)
    # Si aún no hay tag específico, usar el tag estable vigente (ej.: latest) hasta normalizar
    image: mpd_concursos-frontend:latest
    # build:        # REMOVIDO: usar imágenes preconstruidas y etiquetadas
    container_name: mpd-concursos-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    networks:
      - mpd-concursos-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mpd_concursos_mysql_data_prod:
    external: true
  mpd_concursos_storage_data_prod:
    external: true
  nginx_logs:
    driver: local

networks:
  mpd-concursos-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
