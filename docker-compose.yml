version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mpd-concursos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: mpd_concursos
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 800M
        reservations:
          memory: 400M
    networks:
      - mpd-concursos-network

  backend:
    build:
      context: ./concurso-backend
      dockerfile: Dockerfile
    container_name: mpd-concursos-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mpd_concursos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_SQL_INIT_MODE: never
      SPRING_BATCH_JOB_ENABLED: "false"
      LOGGING_LEVEL_AR_GOV_MPD_CONCURSOBACKEND_CONTEST_APPLICATION_SERVICE_CONTESTDATAINITIALIZATIONSERVICE: "OFF"
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_MVC_CORS_ALLOWED_ORIGINS: http://localhost:8000,http://localhost:4200,http://149.50.132.23:8000,https://149.50.132.23:8000
      JAVA_OPTS: "-Xmx1g -Xms512m"
    ports:
      - "8080:8080"
    volumes:
      - document_storage:/app/document-storage
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - mpd-concursos-network

  frontend:
    build:
      context: ./mpd-concursos-app-frontend
      dockerfile: Dockerfile
    container_name: mpd-concursos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:80"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - mpd-concursos-network

volumes:
  mysql_data:
  document_storage:

networks:
  mpd-concursos-network:
    driver: bridge