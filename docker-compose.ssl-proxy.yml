version: '3.8'

services:
  nginx-ssl-proxy:
    image: nginx:stable-alpine
    container_name: mpd-concursos-ssl-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl-setup/nginx-proxy-simple.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl-setup/certbot/conf:/etc/letsencrypt:ro
      - ./ssl-setup/certbot/www:/var/www/certbot:ro
    networks:
      - mpd_concursos_mpd-concursos-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mpd_concursos_mpd-concursos-network:
    external: true
